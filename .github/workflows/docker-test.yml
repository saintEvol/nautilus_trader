name: docker-test

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [test-docker]
  workflow_dispatch:

jobs:
  build-docker-image:
    name: build-docker-image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            slug: linux-amd64
          - platform: linux/arm64
            runner: depot-ubuntu-22.04-arm-8
            slug: linux-arm64
    env:
      BUILD_MODE: release
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          # Docker Buildx still pulls its Moby BuildKit image from Docker Hub.
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            public.ecr.aws:443
            ghcr.io:443
            deb.debian.org:443
            security.debian.org:443
            static.rust-lang.org:443
            pypi.org:443
            files.pythonhosted.org:443
            crates.io:443
            static.crates.io:443

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Free disk space (Ubuntu)
        run: >-
          bash scripts/ci/free-disk-space.sh
          --large-packages --docker-images --tool-cache

      # Fat LTO runs the final cdylib link in one rustc process, beyond Cargo's job cap,
      # so ARM builds need explicit swap headroom.
      - name: Add swap space (Linux ARM)
        if: matrix.platform == 'linux/arm64'
        run: bash scripts/ci/configure-linux-swap.bash

      - name: Verify Docker toolchain pins
        run: bash scripts/ci/check-docker-toolchain-pins.bash

      - name: Pull BuildKit with retry
        run: bash scripts/ci/docker-pull-retry.sh moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Preload Dockerfile images with retry
        run: >-
          bash scripts/ci/preload-buildx-base-image-retry.sh
          "${{ matrix.platform }}" --from-dockerfile .docker/nautilus_trader.dockerfile

      - name: Build nautilus_trader
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/nautilus_trader.dockerfile
          platforms: ${{ matrix.platform }}
          pull: false
          push: false
          cache-from: type=gha,scope=nautilus_trader-test-${{ matrix.slug }}
          # yamllint disable-line rule:line-length
          cache-to: type=gha,mode=max,ignore-error=true,scope=nautilus_trader-test-${{ matrix.slug }}
